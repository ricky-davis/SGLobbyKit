name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0). Must exist in CHANGELOG.md as ## [version] - YYYY-MM-DD"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      dryrun:
        description: "Echo commands instead of executing them"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read   # read other workflows' runs + download their artifacts (thunderstore-build package)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRYRUN: ${{ inputs.dryrun || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z-]+)?$'; then
            echo "Invalid SemVer input: $VERSION" >&2
            exit 1
          fi

      - name: Extract changelog notes
        id: notes
        run: |
          VERSION="${{ inputs.version }}"
          OUTFILE="release-notes.md"

          awk -v v="$VERSION" '
            BEGIN { in_section=0; found=0 }
            {
              sub(/\r$/, "", $0)
            }
            $0 ~ "^## \\[" v "\\]" {
              in_section=1
              found=1
              print $0
              next
            }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print $0 }
            END {
              if (!found) {
                print "Could not find changelog section for version " v > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > "$OUTFILE"
          cat "$OUTFILE"

          echo "path=$OUTFILE" >> "$GITHUB_OUTPUT"

      - name: Download Thunderstore package built for this commit
        id: pkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          ARTIFACT="thunderstore-package-$VERSION"

          # Find the most recent successful thunderstore-build run for THIS exact commit, so the
          # release ships the package that was actually built from the released code. The release is
          # NOT created if the package can't be found — fail here, before the release step.
          echo "Looking for a successful thunderstore-build run for commit $SHA ..."
          RUN_ID="$(gh api -X GET "/repos/$REPO/actions/workflows/thunderstore-build.yml/runs" \
            -f head_sha="$SHA" -f status=success \
            --jq '.workflow_runs[0].id // empty')"

          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful thunderstore-build run found for commit $SHA. Push this commit to main so the build runs (and uploads the package), then re-run this workflow. Release not created." >&2
            exit 1
          fi
          echo "Found thunderstore-build run $RUN_ID; downloading artifact '$ARTIFACT'..."

          mkdir -p dist
          if ! gh run download "$RUN_ID" -n "$ARTIFACT" -D dist; then
            echo "::error::Artifact '$ARTIFACT' not found in run $RUN_ID (expired, or that build ran in dry-run and uploaded nothing). Release not created." >&2
            exit 1
          fi

          ZIP="$(find dist -name '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip inside artifact '$ARTIFACT'. Release not created." >&2
            exit 1
          fi
          echo "Package asset to attach: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_WORKFLOW_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v$VERSION"

          ARGS=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          # The Thunderstore package built from this commit (the download step fails the job if absent).
          ASSET="${{ steps.pkg.outputs.zip }}"

          NOTES_FILE="${{ steps.notes.outputs.path }}"
          CMD=(gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" "${ARGS[@]}" "$ASSET")
          VIEW_CMD=(gh release view "$TAG")

          if [ "$DRYRUN" = "true" ]; then
            echo "Dry run mode. Commands that would be executed:"
            printf '%q ' "${VIEW_CMD[@]}"
            echo
            printf '%q ' "${CMD[@]}"
            echo
            echo "Release notes file: $NOTES_FILE"
            command -v gh >/dev/null 2>&1 || echo "gh CLI not found in runner PATH"
          else
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "Missing required secret: RELEASE_WORKFLOW_TOKEN" >&2
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists" >&2
              exit 1
            fi
            "${CMD[@]}"
          fi
